name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  REACT_IMAGE_NAME: ${{ github.repository }}-react
  DOTNET_IMAGE_NAME: ${{ github.repository }}-dotnet

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) - React
        id: meta-react
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REACT_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Extract metadata (tags, labels) - .NET
        id: meta-dotnet
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.DOTNET_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push React image
        uses: docker/build-push-action@v5
        with:
          context: ./react-app
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-react.outputs.tags }}
          labels: ${{ steps.meta-react.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push .NET image
        uses: docker/build-push-action@v5
        with:
          context: ./dotnet-app
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-dotnet.outputs.tags }}
          labels: ${{ steps.meta-dotnet.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest - React
        run: echo "React image pushed with digest:" ${{ steps.meta-react.outputs.digest }}

      - name: Image digest - .NET
        run: echo ".NET image pushed with digest:" ${{ steps.meta-dotnet.outputs.digest }}
